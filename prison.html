<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1E1B">
<title>登攀記録 — プリズナートレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   トークン（色・文字サイズなどの共通設定）
   ============================================================ */
:root{
  --concrete-900:#0A0D14;   /* 夜の石＝背景 */
  --concrete-800:#101622;
  --concrete-700:#161E2C;   /* パネル */
  --concrete-600:#232B3E;
  --concrete-500:#333D54;   /* 罫線 */
  --chalk:#E9E5DB;          /* 石灰の白＝本文 */
  --chalk-dim:#7A8496;      /* 補助テキスト */
  --brass:#E8C15A;          /* 金＝進級・XP・強調 */
  --brass-dim:#8A6F2E;
  --rust:#C25A3E;           /* 熾火＝休息日・警告 */
  --moss:#6E9070;           /* 達成 */
  --aether:#7FD4E0;         /* 蒼光＝現在地。この一色だけ冷たく光らせる */
  --r:3px;
  --disp:'Oswald','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  --body:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--concrete-900);
  background-image:radial-gradient(ellipse at 50% -6%,rgba(127,212,224,.07),transparent 60%);
  color:var(--chalk);
  font-family:var(--body);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
/* コンクリートの粒状感（薄いノイズ） */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.045;
  background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);
  background-size:4px 4px;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ============================================================
   共通レイアウト
   ============================================================ */
#app{position:relative;z-index:1;padding:0 16px 108px;max-width:560px;margin:0 auto}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

header.top{
  padding:18px 0 12px;display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--concrete-500);margin-bottom:18px;
}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.14em}
.brand small{display:block;font-size:9px;letter-spacing:.34em;color:var(--chalk-dim);font-weight:300}
.datetag{font-family:var(--disp);font-size:12px;letter-spacing:.16em;color:var(--chalk-dim)}

/* 見出しの「ステンシル」ラベル */
.eyebrow{
  font-family:var(--disp);font-size:10px;font-weight:500;letter-spacing:.3em;
  color:var(--chalk-dim);text-transform:uppercase;margin:0 0 8px;display:block;
}
.slab{
  background:var(--concrete-700);border:1px solid var(--concrete-500);
  border-top:2px solid var(--concrete-500);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.muted{color:var(--chalk-dim);font-size:13px}
.num{font-family:var(--disp);font-weight:500;font-variant-numeric:tabular-nums}

/* ============================================================
   正の字タリー（このアプリの主役）
   ============================================================ */
.tallybox{
  background:var(--concrete-800);border:1px solid var(--concrete-500);
  border-radius:var(--r);padding:16px 14px 12px;margin-bottom:14px;
}
.tally-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.tally-n{font-family:var(--disp);font-size:46px;font-weight:300;line-height:.9;color:var(--chalk)}
.tally-n span{font-size:14px;letter-spacing:.2em;color:var(--chalk-dim);margin-left:6px}
.tally-wrap{display:flex;flex-wrap:wrap;gap:10px;min-height:26px}
.tally-wrap svg{width:26px;height:26px;flex:none}
.tally-wrap path{
  stroke:var(--chalk);stroke-width:2.1;stroke-linecap:round;fill:none;opacity:.82;
}
.tally-wrap svg.fresh path{animation:draw .5s ease forwards;stroke-dasharray:30;stroke-dashoffset:30}
@keyframes draw{to{stroke-dashoffset:0}}
.tally-more{font-family:var(--disp);font-size:13px;color:var(--chalk-dim);align-self:center}

/* ============================================================
   種目カード
   ============================================================ */
.ex{
  width:100%;text-align:left;display:block;
  background:var(--concrete-700);border:1px solid var(--concrete-500);
  border-left:3px solid var(--concrete-500);border-radius:var(--r);
  padding:12px 14px;margin-bottom:9px;transition:border-color .15s,background .15s;
}
.ex:active{background:var(--concrete-600)}
.ex.done{border-left-color:var(--moss)}
.ex.ready{border-left-color:var(--brass)}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ex-name{font-weight:600;font-size:15px}
.ex-step{font-family:var(--disp);font-size:11px;letter-spacing:.18em;color:var(--brass)}
.ex-sub{font-size:12.5px;color:var(--chalk-dim);margin-top:3px}
.tchips{display:flex;gap:5px;margin-top:9px}
.tchips div{flex:1;text-align:center;padding:5px 2px 4px;border-radius:2px;
 background:var(--concrete-800);border:1px solid var(--concrete-500);font-size:9.5px;color:var(--chalk-dim)}
.tchips div b{display:block;font-family:var(--disp);font-size:13px;color:var(--chalk-dim);font-weight:500;margin:1px 0}
.tchips div i{font-style:normal;font-size:8.5px;letter-spacing:.1em}
.tchips div.ok{border-color:var(--moss);background:rgba(110,125,82,.14);color:#93A377}
.tchips div.ok b{color:var(--chalk)}
.tchips div.top.ok{border-color:var(--brass);background:rgba(201,162,39,.14);color:var(--brass)}
.ex-goal{font-family:var(--disp);font-size:12px;letter-spacing:.08em;color:var(--chalk);margin-top:6px}
.ex-goal b{color:var(--brass);font-weight:500}

/* 10段階のステップバー */
.bar{display:flex;gap:2px;margin-top:9px}
.bar i{flex:1;height:4px;background:var(--concrete-500);border-radius:1px}
.bar i.f{background:var(--brass)}
.bar i.c{background:var(--chalk);opacity:.35}

.badge-mini{
  font-family:var(--disp);font-size:9px;letter-spacing:.16em;padding:2px 6px;border-radius:2px;
  background:var(--brass);color:#1E1E1B;font-weight:700;
}
.badge-done{background:var(--moss);color:#EDE8DA}
.badge-rest{background:var(--rust);color:#EDE8DA}

/* ============================================================
   ボタン
   ============================================================ */
.btn{
  display:block;width:100%;padding:14px;border-radius:var(--r);text-align:center;
  font-weight:600;letter-spacing:.06em;border:1px solid var(--concrete-500);
  background:var(--concrete-700);color:var(--chalk);
}
.btn:active{background:var(--concrete-600)}
.btn.primary{background:var(--brass);color:#1E1E1B;border-color:var(--brass);font-weight:700}
.btn.rest{border-color:var(--rust);color:#D9A88E}
.btn.rest.on{background:var(--rust);color:#EDE8DA}
.btn.ghost{background:transparent}
.btn.sm{padding:9px;font-size:13px;width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ============================================================
   記録フォーム
   ============================================================ */
.setrow{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px dashed var(--concrete-500);
}
.setrow:last-of-type{border-bottom:none}
.setno{font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--chalk-dim);width:52px;flex:none}
.stepper{display:flex;align-items:center;gap:0;margin-left:auto}
.stepper button{
  width:44px;height:44px;background:var(--concrete-600);border:1px solid var(--concrete-500);
  font-family:var(--disp);font-size:22px;line-height:1;color:var(--chalk);
}
.stepper button:first-child{border-radius:var(--r) 0 0 var(--r)}
.stepper button:last-child{border-radius:0 var(--r) var(--r) 0}
.stepper button:active{background:var(--brass);color:#1E1E1B}
.stepper input{
  width:66px;height:44px;text-align:center;background:var(--concrete-800);
  border:1px solid var(--concrete-500);border-left:none;border-right:none;
  color:var(--chalk);font-family:var(--disp);font-size:19px;font-weight:500;
}
.hit{font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:var(--moss);width:34px;flex:none}

.steppick{display:flex;align-items:center;gap:10px}
.steppick div{flex:1;text-align:center}
.steppick b{display:block;font-family:var(--disp);font-size:18px;letter-spacing:.12em;font-weight:500}
.steppick span{display:block;font-size:12px;color:var(--chalk-dim);margin-top:2px}
.steppick button{width:46px;height:46px;flex:none;background:var(--concrete-600);border:1px solid var(--concrete-500);
 border-radius:var(--r);font-family:var(--disp);font-size:22px;line-height:1}
.steppick button:active{background:var(--brass);color:#1E1E1B}
.steppick button[disabled]{opacity:.3}
.tier{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 12px;margin-bottom:8px;
 border:1px solid var(--concrete-500);border-left:3px solid var(--concrete-500);border-radius:var(--r);background:var(--concrete-800)}
.tier.got{border-left-color:var(--moss)}
.tier.on{background:var(--brass);color:#1E1E1B;border-color:var(--brass);border-left-color:#1E1E1B}
.tier .tk{width:20px;flex:none;text-align:center;font-size:14px;color:var(--moss)}
.tier.on .tk{color:#1E1E1B}
.tier .tn{flex:1;font-weight:700;font-size:15px}
.tier .tn em{display:block;font-style:normal;font-size:10px;font-weight:400;letter-spacing:.14em;color:var(--brass);margin-top:2px}
.tier.on .tn em{color:#1E1E1B;opacity:.7}
.tier .tv{font-family:var(--disp);font-size:20px;font-weight:500;letter-spacing:.04em}
.tier .tv span{font-size:11px;color:var(--chalk-dim);margin-left:2px}
.tier.on .tv span{color:#1E1E1B}
.achv{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:var(--r);
 background:var(--concrete-800);border:1px solid var(--concrete-500);font-size:12.5px;color:var(--chalk-dim)}
.achv b{font-size:15px;color:var(--chalk-dim)}
.achv.ok{border-color:var(--brass)}
.achv.ok b{color:var(--brass)}
.achv span{margin-left:auto;font-family:var(--disp);font-size:12px;letter-spacing:.06em}
.rres{font-size:13px;color:var(--chalk-dim);margin-bottom:10px}
.rres i{display:block;font-style:normal;font-family:var(--disp);font-size:12px;letter-spacing:.08em;
 color:var(--chalk-dim);margin-top:4px}
.rres b{display:block;color:var(--chalk);font-size:16px;letter-spacing:.04em;margin-top:2px}
.tcount div{display:flex;align-items:center;gap:9px;padding:6px 0}
.tcount span{width:34px;flex:none;font-size:12px;color:var(--chalk-dim)}
.tcount i{height:10px;border-radius:2px;background:var(--brass);min-width:2px;display:block}
.tcount b{font-family:var(--disp);font-size:13px;color:var(--chalk);margin-left:auto}
.rpe{display:flex;gap:6px}
.rpe button{
  flex:1;padding:11px 0;border:1px solid var(--concrete-500);border-radius:var(--r);
  font-family:var(--disp);font-size:15px;color:var(--chalk-dim);background:var(--concrete-800);
}
.rpe button.on{background:var(--brass);color:#1E1E1B;border-color:var(--brass);font-weight:700}
textarea{
  width:100%;background:var(--concrete-800);border:1px solid var(--concrete-500);
  border-radius:var(--r);color:var(--chalk);padding:10px;min-height:64px;resize:vertical;
}
.std{display:flex;gap:8px;margin-top:10px}
.std div{
  flex:1;text-align:center;padding:8px 4px;border:1px solid var(--concrete-500);border-radius:var(--r);
  background:var(--concrete-800);
}
.std span{display:block;font-size:9px;letter-spacing:.2em;color:var(--chalk-dim);font-family:var(--disp)}
.std b{font-family:var(--disp);font-size:16px;font-weight:500}
.std.hi b{color:var(--brass)}

/* ============================================================
   進捗（グラフ・カレンダー）
   ============================================================ */
.segs{display:flex;gap:0;margin-bottom:10px;border:1px solid var(--concrete-500);border-radius:var(--r);overflow:hidden}
.segs button{flex:1;padding:9px 0;font-size:13px;color:var(--chalk-dim);background:var(--concrete-800)}
.segs button.on{background:var(--chalk);color:var(--concrete-900);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chips button{
  flex:none;padding:7px 12px;border:1px solid var(--concrete-500);border-radius:20px;
  font-size:12.5px;color:var(--chalk-dim);background:var(--concrete-800);white-space:nowrap;
}
.chips button.on{background:var(--chalk);color:var(--concrete-900);border-color:var(--chalk);font-weight:600}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.cstat{display:flex;gap:6px;margin-top:12px}
.cstat div{flex:1;text-align:center;background:var(--concrete-800);border:1px solid var(--concrete-500);border-radius:2px;padding:7px 2px}
.cstat b{display:block;font-family:var(--disp);font-size:17px;font-weight:500}
.cstat span{font-size:9.5px;color:var(--chalk-dim)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal div{
  aspect-ratio:1;border-radius:2px;background:var(--concrete-800);border:1px solid var(--concrete-600);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:11px;color:var(--chalk-dim);
}
.cal div.t{background:var(--brass);color:#1E1E1B;border-color:var(--brass);font-weight:700}
.cal div.r{background:var(--rust);color:#EDE8DA;border-color:var(--rust)}
.cal div.today{outline:2px solid var(--chalk);outline-offset:-2px}
.cal div.pad{background:none;border:none}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.calhead span{text-align:center;font-family:var(--disp);font-size:9px;letter-spacing:.1em;color:var(--chalk-dim)}

/* ============================================================
   階級・実績
   ============================================================ */
.rank{text-align:center;padding:22px 14px}
.rank-name{font-size:26px;font-weight:700;letter-spacing:.1em;margin:6px 0 2px}
.rank-xp{font-family:var(--disp);font-size:12px;letter-spacing:.2em;color:var(--brass)}
.prog{height:5px;background:var(--concrete-600);border-radius:3px;margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brass)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--concrete-700);border:1px solid var(--concrete-500);border-radius:var(--r);padding:12px 6px;text-align:center}
.stats b{display:block;font-family:var(--disp);font-size:24px;font-weight:500}
.stats span{font-size:10.5px;color:var(--chalk-dim)}
.ghead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;
 padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--concrete-500)}
.ghead span{font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--brass);font-weight:500}
.abar{height:3px;background:var(--concrete-600);border-radius:2px;margin:5px 0 4px;overflow:hidden}
.abar i{display:block;height:100%;background:var(--brass);opacity:.65}
.ach.got .abar i{opacity:1}
.ach{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--concrete-600)}
.ach:last-child{border-bottom:none}
.ach .k{
  width:34px;height:34px;flex:none;border-radius:2px;border:1px solid var(--concrete-500);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;
  color:var(--concrete-500);background:var(--concrete-800);
}
.ach.got .k{background:var(--brass);border-color:var(--brass);color:#1E1E1B;font-weight:700}
.ach.got .t{color:var(--chalk)}
.ach .t{font-size:13.5px;color:var(--chalk-dim);font-weight:600}
.ach .d{font-size:11.5px;color:var(--chalk-dim)}

/* ============================================================
   タブバー
   ============================================================ */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(30,30,27,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--concrete-500);
  padding-bottom:var(--safe-b);
  display:flex;
}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--chalk-dim)}
nav button.on{color:var(--brass)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav span{font-size:9.5px;letter-spacing:.08em}


/* ============================================================
   ゲーム要素：踏破・任務・守護者・遺物カード
   ============================================================ */
.term{background:linear-gradient(180deg,var(--concrete-800),var(--concrete-700));border:1px solid var(--concrete-500);border-radius:var(--r);padding:16px 14px;margin-bottom:12px;position:relative;overflow:hidden}
.term-top{display:flex;align-items:flex-start;justify-content:space-between}
.term-n{font-family:var(--disp);font-size:42px;font-weight:300;line-height:.95}
.term-n span{font-size:13px;color:var(--chalk-dim);margin-left:5px;letter-spacing:.1em}
.term-cut{font-family:var(--disp);font-size:13px;color:var(--brass);letter-spacing:.1em}
.term-bar{height:9px;background:var(--concrete-600);border-radius:5px;margin-top:14px;overflow:hidden}
.term-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rust),var(--brass));transition:width .5s ease}
.term-bar b{position:absolute;top:-2px;width:1px;height:13px;background:rgba(237,232,218,.45)}
.cutbreak{display:flex;gap:6px;margin-top:12px}
.cutbreak div{flex:1;text-align:center;background:rgba(0,0,0,.22);border-radius:2px;padding:6px 2px}
.cutbreak b{display:block;font-family:var(--disp);font-size:15px;color:var(--brass);font-weight:500}
.cutbreak b::before{content:'\2212'}
.cutbreak b::after{content:'日';font-size:9px;color:var(--chalk-dim);margin-left:1px}
.cutbreak span{font-size:9.5px;color:var(--chalk-dim)}
.term-n span{font-size:13px;color:var(--chalk-dim);margin:0 2px 0 3px;letter-spacing:.06em}
.term-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--chalk-dim);margin-top:6px;font-family:var(--disp);letter-spacing:.14em}
.term.free{border-color:var(--brass)}


.order{background:linear-gradient(180deg,var(--concrete-800),var(--concrete-700));border:1px solid var(--concrete-500);border-left:3px solid var(--brass);border-radius:var(--r);padding:13px 12px;margin-bottom:14px}
.order.cleared{border-left-color:var(--moss);opacity:.82}
.order-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.order-tag{font-size:11px;letter-spacing:.16em;color:var(--brass);font-weight:500}
.order.cleared .order-tag{color:var(--moss)}
.order-n{font-family:var(--disp);font-size:13px;color:var(--chalk-dim)}
.order-row{display:flex;align-items:stretch;gap:8px}
.order-x{align-self:center;color:var(--chalk-dim);font-size:15px;flex:none}
.order-card{flex:1;min-width:0;text-align:left;background:var(--concrete-900);border:1px solid var(--concrete-600);border-radius:4px;padding:9px 9px 8px;color:var(--chalk);cursor:pointer}
.order-card:active{background:var(--concrete-700)}
.order-card.done{border-color:var(--moss);opacity:.6}
.order-name{font-size:13.5px;font-weight:500;margin-bottom:3px}
.order-sub{font-size:10.5px;color:var(--chalk-dim);line-height:1.35;margin-bottom:5px}
.order-std{font-family:var(--disp);font-size:11px;color:var(--brass);letter-spacing:.04em}
.order-card.done .order-std{color:var(--moss)}
.order-foot{margin-top:9px;font-size:10.5px;color:var(--chalk-dim);text-align:center}
.hrow{position:relative}
.hdel{position:absolute;right:-4px;top:6px;width:32px;height:32px;padding:0;
  background:none;border:none;color:var(--concrete-500);cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:4px}
.hdel svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.hdel:active{background:rgba(194,90,62,.18);color:var(--rust)}
.hbody{padding-right:30px}
.hfloor{position:absolute;bottom:8px;right:14px;transform:translateX(50%);
  pointer-events:none;filter:blur(3px);border-radius:50%}
.sc-glow{position:absolute;left:4%;bottom:4%;width:22%;height:14%;
  pointer-events:none;filter:blur(4px);border-radius:50%}
/* ===== ホームの一枚絵 ===== */
.cell.scene{position:relative;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--concrete-600);margin-bottom:12px}
.cell.scene img{image-rendering:pixelated;position:absolute;display:block}
.sc-guard{left:calc(61% - 14px);filter:brightness(.16) drop-shadow(0 0 5px rgba(127,212,224,.55));
  animation:sc-float 3.4s ease-in-out infinite}
@keyframes sc-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.sc-hero{left:9%;bottom:7%;height:26%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.sc-floor{position:absolute;left:10px;top:8px;font-family:var(--disp);line-height:1;
  color:var(--chalk);text-shadow:0 2px 4px #000}
.sc-floor b{font-size:30px;font-weight:300;letter-spacing:.02em}
.sc-floor span{font-size:11px;color:var(--chalk-dim);margin-left:3px}
.sc-dom{position:absolute;left:11px;top:40px;font-size:10.5px;letter-spacing:.24em;
  color:var(--brass);text-shadow:0 1px 3px #000}
.sc-next{position:absolute;right:9px;bottom:8px;font-size:10.5px;color:var(--chalk-dim);
  background:rgba(8,11,18,.72);border:1px solid var(--concrete-600);border-radius:2px;
  padding:3px 7px}
.sc-next b{color:var(--chalk);font-size:12px;margin-left:3px}
.sc-form{position:absolute;left:9px;bottom:8px;font-size:11px;color:var(--chalk);
  background:rgba(8,11,18,.72);border:1px solid var(--concrete-600);border-radius:2px;
  padding:3px 8px;letter-spacing:.06em}
/* ===== 戦闘ステージ ===== */
.stage{position:relative;height:150px;margin:6px -12px 4px;overflow:hidden;
  background:linear-gradient(180deg,#0E1420 0%,#141C2C 52%,#1A2233 52%,#0C1018 100%)}
.stage::before{content:'';position:absolute;left:0;right:0;top:52%;height:1px;background:#2A3448}
.stage .grid{position:absolute;left:0;right:0;top:52%;bottom:0;opacity:.35;
  background:repeating-linear-gradient(90deg,transparent 0 27px,#2A3448 27px 28px)}
.stage.shake{animation:stg-shake .24s ease-out}
@keyframes stg-shake{0%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}
  45%{transform:translate(4px,-2px)}70%{transform:translate(-2px,1px)}100%{transform:translate(0,0)}}
.fighter{position:absolute;bottom:14px;display:flex;align-items:flex-end;justify-content:center}
.fighter img{image-rendering:pixelated;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}
.f-guard{left:16px;transition:transform .15s ease-out,opacity .45s linear,filter .1s linear}
.f-hero{right:16px;transition:transform .11s cubic-bezier(.3,0,.2,1)}
.f-hero img{transform:scaleX(-1)}
.f-guard.hit{filter:brightness(4) saturate(0);transform:translateX(-9px)}
.f-guard.block{filter:brightness(1.8) hue-rotate(180deg)}
.f-guard.spent{opacity:.5;filter:grayscale(.55)}
.f-guard.dead{transform:translateX(-16px) rotate(-16deg);opacity:0;filter:brightness(2)}
.f-hero.wind{transform:translateX(9px)}
.f-hero.lunge{transform:translateX(-58px)}
.f-hero.recoil{transform:translateX(26px)}
.shadow{position:absolute;bottom:10px;height:6px;border-radius:50%;background:#000;
  opacity:.55;filter:blur(2px)}
.dmgnum{position:absolute;left:0;right:0;top:26px;text-align:center;pointer-events:none;
  font-family:var(--disp);font-size:30px;font-weight:500;color:#fff;opacity:0;
  text-shadow:0 2px 0 #8A1E10,0 0 12px rgba(255,180,80,.8)}
.dmgnum.on{animation:dmg-pop .7s ease-out}
@keyframes dmg-pop{0%{opacity:0;transform:translateY(12px) scale(.6)}
  18%{opacity:1;transform:translateY(-6px) scale(1.18)}
  40%{transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-26px) scale(1)}}
.slashfx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0}
.slashfx.on{animation:slash .28s ease-out}
@keyframes slash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.slashfx i{position:absolute;left:24%;top:20%;width:66px;height:3px;background:#FFF;
  box-shadow:0 0 10px #FFE9A0;transform:rotate(38deg);border-radius:2px}
.stage-cap{position:absolute;left:10px;top:8px;font-family:var(--disp);font-size:10px;
  letter-spacing:.18em;color:var(--chalk-dim)}
.stage-hp{position:absolute;right:10px;top:8px;display:flex;gap:3px}
.stage-hp i{width:20px;height:6px;border-radius:1px;background:#1A2230;
  box-shadow:inset 0 0 0 1px #333D54;transition:background .25s}
.stage-hp i.d{background:var(--brass);box-shadow:0 0 6px rgba(232,193,90,.55)}
.spr{display:flex;align-items:flex-end;justify-content:center;height:100%}
.spr img{image-rendering:pixelated;image-rendering:crisp-edges;
  max-width:100%;max-height:100%;width:auto;height:auto;display:block;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.spr.boss{align-items:flex-end;justify-content:center}
.spr.boss img{max-height:none;max-width:none}
.spr.av img{height:100%}
.rank-av{width:104px;height:108px;margin:6px auto 0;display:flex;align-items:flex-end;justify-content:center}
.rank-av .spr{width:100%;height:100%}
.rank-av img{width:auto;max-width:100%;image-rendering:pixelated}
.rank-form{font-size:11px;color:var(--brass);letter-spacing:.12em;margin:2px 0 -2px}
.ex .icn{display:flex;align-items:flex-end;justify-content:center}
.lastrec{display:flex;align-items:center;gap:8px;background:var(--concrete-800);
  border:1px solid var(--concrete-600);border-left:3px solid var(--aether);
  border-radius:var(--r);padding:8px 11px;margin-bottom:12px;font-size:12px}
.lastrec span{color:var(--chalk-dim);font-size:11px;flex:none}
.lastrec b{font-family:var(--disp);font-size:15px;font-weight:400;letter-spacing:.04em;flex:1}
.lastrec i{font-style:normal;font-size:10.5px;color:var(--aether);letter-spacing:.08em}
.lastrec.none{border-left-color:var(--concrete-500);color:var(--chalk-dim);
  justify-content:center;font-size:11.5px}
.quest{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--concrete-600)}
.quest:last-child{border-bottom:none}
.q-box{width:20px;height:20px;flex:none;border:1.5px solid var(--concrete-500);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.quest.ok .q-box{background:var(--moss);border-color:var(--moss);color:#EDE8DA}
.quest .q-t{flex:1;font-size:13.5px}
.quest.ok .q-t{color:var(--chalk-dim);text-decoration:line-through}
.q-xp{font-family:var(--disp);font-size:11px;color:var(--brass);letter-spacing:.1em;flex:none}

.guard{display:flex;align-items:center;gap:8px;margin-top:9px}
.guard-n{font-size:11px;color:var(--chalk-dim)}
.hp{display:flex;gap:3px;margin-left:auto}
.hp i{width:15px;height:6px;border-radius:1px;background:var(--concrete-500)}
.hp i.d{background:var(--rust)}
.hp i.k{background:var(--brass)}

.combo{font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--brass);border:1px solid var(--brass-dim);border-radius:2px;padding:3px 7px;white-space:nowrap}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.card{background:var(--concrete-800);border:1px solid var(--concrete-500);border-radius:var(--r);padding:9px 7px;text-align:center;min-height:74px;display:flex;flex-direction:column;justify-content:center;position:relative}
.card.r2{border-color:var(--brass-dim)}
.card.r3{border-color:var(--brass);box-shadow:inset 0 0 20px rgba(201,162,39,.15)}
.card.lock{opacity:.3}
.card b{font-size:11px;display:block;line-height:1.35;font-weight:600}
.card em{font-style:normal;font-family:var(--disp);font-size:8.5px;letter-spacing:.16em;color:var(--chalk-dim);display:block;margin-top:4px}
.card u{text-decoration:none;position:absolute;top:3px;right:5px;font-family:var(--disp);font-size:9px;color:var(--brass)}
.cardbig{border:1px solid var(--brass);border-radius:var(--r);padding:16px;background:var(--concrete-800);margin:4px 0 14px;text-align:center}
.cardbig .rar{font-family:var(--disp);font-size:9px;letter-spacing:.3em;color:var(--brass)}
.cardbig .nm{font-size:16px;font-weight:700;margin:6px 0 8px}
.cardbig .qt{font-size:12.5px;color:var(--chalk-dim);line-height:1.7}
.gain{font-family:var(--disp);font-size:38px;font-weight:300;color:var(--brass);line-height:1}
.gain span{font-size:13px;letter-spacing:.16em}


/* ============================================================
   絵とアニメーション
   ============================================================ */
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-7px) rotate(-3deg)}
 32%{transform:translateX(6px) rotate(3deg)}50%{transform:translateX(-4px) rotate(-2deg)}70%{transform:translateX(3px)}85%{transform:translateX(-1px)}}
@keyframes flashw{0%,100%{filter:none}25%{filter:brightness(3) saturate(.2)}}
@keyframes fall{0%{transform:none;opacity:1}100%{transform:translateY(16px) rotate(-16deg);opacity:.3;filter:grayscale(1)}}
@keyframes slash{0%{opacity:1;transform:rotate(-32deg) scaleX(0)}45%{opacity:1;transform:rotate(-32deg) scaleX(1.5)}100%{opacity:0;transform:rotate(-32deg) scaleX(1.7)}}
@keyframes dmgpop{0%{opacity:1;transform:translate(-50%,0) scale(.7)}25%{transform:translate(-50%,-12px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
@keyframes stampIn{0%{transform:scale(2.8) rotate(-18deg);opacity:0}55%{transform:scale(.92) rotate(-7deg);opacity:1}75%{transform:scale(1.04) rotate(-5deg)}100%{transform:scale(1) rotate(-6deg)}}
@keyframes flipin{0%{transform:perspective(600px) rotateY(96deg);opacity:0}55%{opacity:1}100%{transform:perspective(600px) rotateY(0);opacity:1}}
@keyframes shim{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes risein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 石室シーン（トップの絵） */
.cell{position:relative;border:1px solid var(--concrete-500);border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:#15150F}
.cell svg{display:block;width:100%;height:auto}
.cell .av{animation:floaty 4.5s ease-in-out infinite;transform-origin:center bottom}
.cell-cap{position:absolute;left:12px;bottom:9px;font-family:var(--disp);font-size:9.5px;letter-spacing:.28em;color:rgba(237,232,218,.5)}

/* 踏破バーに走る光 */
.term-bar{position:relative}
.term-bar::after{content:'';position:absolute;top:0;left:0;width:34%;height:100%;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);animation:shim 3.4s ease-in-out infinite}

/* 守護者スプライト */
.gsprite{position:relative;display:flex;justify-content:center;padding:6px 0 2px;animation:floaty 3.4s ease-in-out infinite}
.gsprite.gh,.gsprite.dead{animation:none}
.gsprite svg{width:118px;height:118px;transform-origin:center bottom}
.gsprite.gh svg{animation:shake .5s cubic-bezier(.36,.07,.19,.97),flashw .5s ease}
.gsprite.dead svg{animation:fall .7s ease forwards}
.gsprite .fx{position:absolute;top:38%;left:50%;width:104px;height:4px;margin-left:-52px;border-radius:2px;
 background:linear-gradient(90deg,transparent,var(--chalk),transparent);opacity:0;pointer-events:none}
.gsprite.gh .fx{animation:slash .42s ease-out}
.gsprite .dmg{position:absolute;top:26%;left:50%;font-family:var(--disp);font-size:26px;font-weight:700;
 color:var(--rust);text-shadow:0 2px 0 #1E1E1B;opacity:0;pointer-events:none}
.gsprite.gh .dmg{animation:dmgpop .85s ease-out}
.modal .gsprite svg{width:84px;height:84px}
.gname{text-align:center;font-family:var(--disp);letter-spacing:.22em;font-size:11px;color:var(--chalk-dim);margin-top:-2px}
.gname b{color:var(--chalk);font-weight:500;letter-spacing:.1em}
.ghp{display:flex;gap:4px;justify-content:center;margin-top:9px}
.ghp i{width:26px;height:9px;border-radius:2px;background:var(--concrete-600);border:1px solid var(--concrete-500)}
.ghp i.d{background:var(--rust);border-color:var(--rust)}
.ghp i.k{background:var(--brass);border-color:var(--brass);animation:glow 1.6s ease-in-out infinite}

/* 種目カードの守護者アイコン */
.ex{display:flex;gap:12px;align-items:flex-start}
.ex .icn{width:44px;height:44px;flex:none;margin-top:2px;opacity:.9}
.ex .icn svg{width:100%;height:100%}
.ex.done .icn{filter:grayscale(1);opacity:.4}
.ex .bd{flex:1;min-width:0}

/* カードのめくり演出 */
.cardbig{animation:flipin .55s ease-out}
.stamp.big{animation:stampIn .6s cubic-bezier(.2,1.6,.4,1) both;display:inline-block}
.view.on{animation:risein .3s ease}
.sparkbox{position:absolute;inset:0;pointer-events:none;overflow:visible}
.sparkbox i{position:absolute;top:50%;left:50%;width:4px;height:4px;border-radius:50%;background:var(--brass);animation:spark .7s ease-out forwards}


/* ============================================================
   履歴・種目詳細
   ============================================================ */
.hrow{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--concrete-600)}
.hrow:last-of-type{border-bottom:none}
.hdate{font-family:var(--disp);font-size:12px;color:var(--chalk-dim);width:38px;flex:none;padding-top:2px;letter-spacing:.04em}
.hbody{flex:1;min-width:0}
.hline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.htier{font-size:10px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:.06em}
.htier.beg{background:var(--concrete-500);color:var(--chalk)}
.htier.int{background:var(--moss);color:#EDE8DA}
.htier.pro{background:var(--brass);color:#1E1E1B}
.htier.none{background:transparent;border:1px solid var(--rust);color:#C08A6E}
.hstep{font-family:var(--disp);font-size:11px;letter-spacing:.12em;color:var(--chalk-dim)}
.hname{font-size:12px;color:var(--chalk)}
.hsets{font-family:var(--disp);font-size:13px;letter-spacing:.04em;color:var(--chalk);margin-top:3px}
.hmemo{font-size:11.5px;color:var(--chalk-dim);margin-top:3px;overflow-wrap:anywhere}

.dstep{font-family:var(--disp);font-size:34px;font-weight:300;line-height:1.1;margin-top:4px}
.dstep span{font-size:14px;color:var(--chalk-dim);letter-spacing:.1em}

.srow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--concrete-600)}
.srow:last-child{border-bottom:none}
.srow.past{opacity:.55}
.srow.now{background:rgba(201,162,39,.08);margin:0 -14px;padding:11px 14px;border-radius:2px}
.sno{font-family:var(--disp);font-size:13px;color:var(--chalk-dim);width:22px;flex:none;text-align:center}
.srow.now .sno{color:var(--brass)}
.sbody{flex:1;min-width:0}
.sname{font-size:13px;overflow-wrap:anywhere}
.sname em{font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--brass);border:1px solid var(--brass-dim);border-radius:2px;padding:1px 5px;margin-left:5px;white-space:nowrap}
.ssub{font-size:11px;color:var(--chalk-dim);margin-top:2px}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--concrete-600);border:1px solid var(--concrete-500)}
.sdot.beg{background:var(--concrete-500);border-color:var(--chalk-dim)}
.sdot.int{background:var(--moss);border-color:var(--moss)}
.sdot.pro{background:var(--brass);border-color:var(--brass)}
.sdot.none{background:transparent;border-color:var(--rust)}

/* トースト・モーダル */
#toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,14px);
  background:var(--chalk);color:var(--concrete-900);padding:11px 18px;border-radius:var(--r);
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;
  max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(15,15,13,.86);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.modal .box{background:var(--concrete-700);border:1px solid var(--brass);border-radius:var(--r);padding:22px;max-width:340px;width:100%;text-align:center}
.stamp{font-family:var(--disp);font-size:11px;letter-spacing:.34em;color:var(--brass);margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

['フル・プッシュアップ',[1,8],[2,12],[3,15]],
['ディップス（足補助）',[1,8],[2,12],[3,15]],
['フル・ディップス',[1,8],[2,12],[3,15]],
['テンポ・ディップス（5秒）',[1,5],[2,8],[3,10]],
['アーチャー・プッシュアップ',[1,5],[2,8],[3,10]],

{id:'p2',n:'垂直プッシュ',t:'肩・上背',s:[

const KEY='pt_v2';
/* 初回テスト（2026-08-14）の判定結果を開始ステップの既定値にする */
const INIT_STEPS={p1:4,p2:2,p3:3,p4:4,p5:4,p6:4,p7:4,p8:3};
let memoryOnly=false;
let db=load();

function blank(){
  const st={};EX.forEach(e=>st[e.id]=INIT_STEPS[e.id]||1);
  return {v:2,steps:st,logs:[],rest:[],promotions:[],cards:{},quests:{}};
}
/** 壊れた・古い保存データを安全な形に整える（不正な記録は捨てる） */
function sanitize(d){
  const b=blank();
  if(!d||typeof d!=='object')return b;
  const num=(v,lo,hi,def)=>{const n=parseInt(v);return (isFinite(n)&&n>=lo&&n<=hi)?n:def;};
  EX.forEach(e=>{b.steps[e.id]=num((d.steps||{})[e.id],1,9,INIT_STEPS[e.id]||1);});
  b.logs=(Array.isArray(d.logs)?d.logs:[]).filter(l=>l&&typeof l==='object'&&ex(l.ex)).map(l=>{
    const st=num(l.step,1,9,1);
    let dt=String(l.date||today());
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||dt>today())dt=today();   /* 未来日付・不正書式は今日に寄せる */
    const o={date:dt,ex:l.ex,step:st,
             rpe:num(l.rpe,0,5,0),memo:String(l.memo||''),xp:num(l.xp,0,100000,0)};
    const sets=Array.isArray(l.sets)?l.sets.map(v=>num(v,0,100000,0)).filter(v=>v>0):null;
    if(sets&&sets.length)o.sets=sets;
    if(l.tier!==undefined&&l.tier!==null)o.tier=num(l.tier,0,3,0);
    if(l.unit)o.unit=String(l.unit);
    if(o.tier===undefined&&!o.sets)o.tier=1;      /* 情報がない記録は初級扱い */
    return o;});
  b.rest=(Array.isArray(d.rest)?d.rest:[])
    .filter(x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&x<=today());
  b.promotions=(Array.isArray(d.promotions)?d.promotions:[]).filter(x=>x&&typeof x==='object');
  b.cards=(d.cards&&typeof d.cards==='object'&&!Array.isArray(d.cards))?d.cards:{};
  b.quests={};
  if(d.quests&&typeof d.quests==='object'&&!Array.isArray(d.quests))
    Object.keys(d.quests).forEach(k=>{if(Array.isArray(d.quests[k]))b.quests[k]=d.quests[k];});
  return b;
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw)return sanitize(JSON.parse(raw));
  }catch(e){memoryOnly=true;}
  return blank();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){memoryOnly=true;}
}

const $=s=>document.querySelector(s);
function ymd(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function today(){return ymd(new Date());}
function shift(str,n){const[a,b,c]=str.split('-').map(Number);const d=new Date(a,b-1,c);d.setDate(d.getDate()+n);return ymd(d);}
function ex(id){return EX.find(e=>e.id===id);}
function step(id){const n=parseInt(db.steps[id]);return (n>=1&&n<=9)?n:1;}
function stepData(id,n){
  const e=ex(id);
  const s=(e&&e.s[Math.min(9,Math.max(1,parseInt(n)||1))-1])||['—',[1,1],[1,1],[1,1]];
  return {name:s[0],beg:s[1],int:s[2],pro:s[3],unit:s[4]||'r'};
}
function u(unit,v){return unit==='s'?v+'秒':v+'回';}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2100);}

function trainDays(d){return [...new Set(d.logs.map(l=>l.date))].sort();}
function totalSets(d){return d.logs.reduce((a,l)=>a+setsOf(l),0);}
function activeDays(d){return new Set([...d.logs.map(l=>l.date),...d.rest]);}
function streak(d){
  const set=activeDays(d);let cur=today(),n=0;
  if(!set.has(cur))cur=shift(cur,-1);              // 今日まだなら昨日から数える
  while(set.has(cur)){n++;cur=shift(cur,-1);}
  return n;
}
function questCount(d){let n=0;const q=d.quests||{};
  Object.keys(q).forEach(k=>{if(Array.isArray(q[k]))n+=q[k].length;});return n;}
function questXP(d){let n=0;const qq=d.quests||{};
  Object.keys(qq).forEach(k=>{if(!Array.isArray(qq[k]))return;
    qq[k].forEach(id=>{const q=QPOOL.find(p=>p.id===id);if(q)n+=q.x;});});return n;}
function xp(d){
  const l=d.logs.reduce((a,x)=>a+(x.xp||(setsOf(x)*10+50)),0);
  return l + d.promotions.length*200 + d.rest.length*5 + questXP(d);
}
/** 連続日数によるXP倍率：5日ごとに+0.1、最大×1.5 */
function combo(){return Math.min(1.5,1+Math.floor(streak(db)/5)/10);}
/** そのステップを「修了」したか（最終ステップは進級先がないので基準クリアで判定） */
function mastered(id){
  const st=db.steps[id]||1;if(st<9)return false;
  return bestTier(id,9)>=3;
}
function masterCount(){return EX.filter(e=>mastered(e.id)).length;}
/* 踏破の内訳：トレーニング1日=4／進級1回=150／系統修了=320
   28Fスタートから全72Fまで44進級＋8修了で9,160。残りは通った日数で埋める。
   週4〜5回の実施なら、全ステップを登り切る頃に頂上へ届く配分 */
const CUT={day:4,promo:150,master:320};
function cutDays(d){
  const days=trainDays(d).length*CUT.day;
  const pro=d.promotions.length*CUT.promo;
  const ms=EX.filter(e=>{const st=d.steps[e.id]||1;if(st<9)return false;
    return d.logs.some(l=>l.ex===e.id&&l.step===9&&tierOf(l)===3);}).length*CUT.master;
  return Math.min(TERM,days+pro+ms);
}
function remain(d){return TERM-cutDays(d);}
function cutPct(d){return cutDays(d)/TERM*100;}
/** 日数を「◯年◯ヶ月◯日」に */
function fmtTerm(n){
  const y=Math.floor(n/365),m=Math.floor((n%365)/30),dd=(n%365)%30;
  return (y?y+'<span>年</span>':'')+(m?m+'<span>ヶ月</span>':'')+dd+'<span>日</span>';
}
/** 守護者のHP＝初級・中級・上級の3段階。クリアした段階だけ削れる */
function guardHP(id,extraTier,atStep){
  const st=atStep||step(id);
  const b=Math.max(bestTier(id,st),extraTier||0);
  return {max:3,d:Math.min(3,b)};
}
/** 現在のステップで初級・中級・上級のどこまで到達したかを示すチップ */
function tchips(id,st){
  const sd=stepData(id,st),b=bestTier(id,st),un=sd.unit==='s'?'秒':'';
  const g=[sd.beg,sd.int,sd.pro];
  let h='<div class="tchips">';
  for(let t=1;t<=3;t++)
    h+='<div class="'+(b>=t?'ok ':'')+(t===3?'top':'')+'">'+TIER[t]
      +'<b>'+g[t-1][0]+'\u00d7'+g[t-1][1]+un+'</b>'
      +'<i>'+(b>=t?'達成':'未')+'</i></div>';
  return h+'</div>';
}
function hpPips(g){let h='';for(let i=0;i<g.max;i++)h+='<i class="'+(i<g.d?(g.d>=g.max?'k':'d'):'')+'"></i>';return h;}
/** 遺物カードを1枚引く（並70% / 稀25% / 極5%） */
function drawCard(){
  const r=Math.random(),rar=r<0.05?3:r<0.30?2:1;
  const pool=CARDS.filter(c=>c.r===rar);
  const c=pool[Math.floor(Math.random()*pool.length)];
  db.cards[c.id]=(db.cards[c.id]||0)+1;
  return c;
}
/** 今日の任務の達成判定。新たに達成したものを返す */
function checkQuests(){
  const t=today(),L=db.logs.filter(l=>l.date===t);
  const got=db.quests[t]||[],nw=[];
  todayQuests().forEach(q=>{if(!got.includes(q.id)&&q.c(L)){got.push(q.id);nw.push(q);}});
  db.quests[t]=got;return nw;
}
function rankOf(pct){let i=0;for(let k=0;k<RANKS.length;k++)if(pct>=RANKS[k][0])i=k;return i;}
function logsOn(date,id){return db.logs.filter(l=>l.date===date&&l.ex===id);}
/** 進級基準を満たしているか（旧データの回数記録用） */
function meetsPro(sets,pro){return sets.filter(v=>v>=pro[1]).length>=pro[0];}
/* --- 記録の段階（1=初級 / 2=中級 / 3=上級＝進級基準） --- */
const TIER=['','初級','中級','上級'];
/** 記録が何段階か。旧形式（回数記録）は自動で段階に変換する */
function tierOf(l){
  if(l.tier!==undefined)return l.tier;
  if(!l.sets)return 1;
  const sd=stepData(l.ex,l.step);
  if(meetsPro(l.sets,sd.pro))return 3;
  if(meetsPro(l.sets,sd.int))return 2;
  return 1;
}
/** その段階の基準 [セット数, 回数] */
function stdOf(id,st,t){const sd=stepData(id,st);return t===3?sd.pro:t===2?sd.int:sd.beg;}
function setsOf(l){return (l.sets&&l.sets.length)?l.sets.length:stdOf(l.ex,l.step,tierOf(l))[0];}
function repsOf(l){const g=stdOf(l.ex,l.step,tierOf(l));
  return (l.sets&&l.sets.length)?l.sets.reduce((a,b)=>a+b,0):g[0]*g[1];}
/** ある種目のあるステップで到達済みの最高段階 */
function bestTier(id,st){
  let b=0;db.logs.forEach(l=>{if(l.ex===id&&l.step===st)b=Math.max(b,tierOf(l));});
  return b;
}
/** 到達度：ステップと段階を1本の物差しに（最大30） */
function reachOf(l){return (l.step-1)*3+tierOf(l);}
function advCount(d){return d.logs.filter(l=>tierOf(l)===3).length;}
function midCount(d){return d.logs.filter(l=>tierOf(l)>=2).length;}
function canPromote(id){
  const st=step(id);
  return st<9 && bestTier(id,st)>=3;
}

/* ============================================================
   4. 正の字タリー（連続日数を描く）
   ============================================================ */
const STROKES=['M3,3 L17,3','M9,3 L9,17','M9,9 L16,9','M3,9 L3,17','M3,17 L17,17'];
function tallySVG(k,fresh){
  let p='';for(let i=0;i<k;i++)p+='<path d="'+STROKES[i]+'"/>';
  return '<svg viewBox="0 0 20 20" class="'+(fresh?'fresh':'')+'" aria-hidden="true">'+p+'</svg>';
}
function tallyHTML(n){
  if(n===0)return '<span class="muted">まだ刻まれていない</span>';
  const full=Math.floor(n/5),rest=n%5;
  const show=Math.min(full,11);let h='';
  for(let i=0;i<show;i++)h+=tallySVG(5,false);
  if(full>show)h+='<span class="tally-more">+'+(full-show)*5+'</span>';
  if(rest)h+=tallySVG(rest,true);
  return h;
}

/* 1文字=1ドット。横に連続する同色はまとめて矩形に */
function px(map,pal){
  const h=map.length,w=map[0].length;let out='';
  for(let y=0;y<h;y++){let x=0;
    while(x<w){const ch=map[y][x];
      if(ch==='.'||!pal[ch]){x++;continue;}
      let n=1;while(x+n<w&&map[y][x+n]===ch)n++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+n+'" height="1" fill="'+pal[ch]+'"/>';x+=n;}}
  return out;
}

  return '<svg viewBox="0 0 48 48">'+px(G[m],PAL[dom])+halo(dom)+'</svg>';
}

/* 戦士のパレット（階級で装備色が変わる） */
function hpal(r){
  const hi = r>=5, mid = r>=3;
  return {o:'#080B12',
   '1':hi?'#12283A':'#1A2030','2':hi?'#1E4458':'#2E3A4E','3':hi?'#2E6E86':'#4A5A72',
   '4':hi?'#4A9EB4':'#6E8098','5':hi?'#8ADCE8':'#9FB2C6',
   '6':'#2E2416','7':'#4A3A22','8':'#6E5632',
   b:mid?'#2A3348':'#3A3E3A',c:mid?'#3E4A66':'#4E5450',d:mid?'#1C2233':'#262A26',
   l:hi?'#8ADCE8':(mid?'#7A88A6':'#6E7470'),
   n:mid?'#1E2A44':'#2A2E2A',m:mid?'#33436A':'#3A3E3A',
   s:'#E0BC90',t:'#A87C58',h:'#2A2230',e:'#0A0C12',
   v:'#B8C8DC',u:'#6E7E96',w:'#FFFFFF',k:'#101622',
   g:'#D8A83C',y:'#FFE9A0',p:hi?'#2E5A9E':'#7A3A18',q:hi?'#7FD4E0':'#C07A28'};
}
function warrior(r){
  let s='<svg viewBox="0 0 40 46">';
  if(r>=5)s+='<rect width="40" height="46" fill="#7FD4E0" opacity=".05"/>';
  return s+px(HR[r],hpal(r))+'</svg>';
}

/* 青枠（JRPGの定番様式） */
function frame(x,y,w,h,id){
  return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
   +'<stop offset="0" stop-color="#2B4A9E"/><stop offset="1" stop-color="#0E1840"/></linearGradient></defs>'
   +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="url(#'+id+')"/>'
   +'<rect x="'+(x+.5)+'" y="'+(y+.5)+'" width="'+(w-1)+'" height="'+(h-1)+'" fill="none" stroke="#EDF0FA" stroke-width="1"/>'
   +'<rect x="'+(x+2)+'" y="'+(y+2)+'" width="'+(w-4)+'" height="'+(h-4)+'" fill="none" stroke="#5A7ACE" stroke-width=".8"/>';
}


function guardIMG(id,st,mode){
  const s=(st===undefined)?step(id):st, d=domOf(s);
  const m=GMETA[id].t[d], src=GSPR[id][d];
  if(mode==='boss'){
    const k=Math.max(m.w,m.h)/75;
    return '<div class="spr boss" style="height:'+(52+k*56).toFixed(0)+'px">'
      +'<img src="'+src+'" alt="" style="height:100%"></div>';
  }
  return '<div class="spr"><img src="'+src+'" alt=""></div>';
}
function guardSVG(id,st){return guardIMG(id,st,'icon');}
function guardName(id,st){return GMETA[id].t[domOf(st)].n;}

/* 階級(0-14) → 鎧デザイン(0-6) */
function kDesign(r){return Math.min(6,Math.max(0,(r|0)*7/KNAME.length|0));}

/** 階級とポーズから絵を返す。poseは 'idle' か 'a1'〜'a9' */
function knightSrc(rank,pose){
  const d=kDesign(Math.max(0,Math.min(KNAME.length-1,rank|0)));
  return HD[d][pose]||HD[d].idle;
}
function knightSize(rank,pose){
  const d=kDesign(Math.max(0,Math.min(KNAME.length-1,rank|0)));
  return HSZ7[d][pose]||HSZ7[d].idle;
}
/** 階級ごとの色調（明度・彩度）をCSSのfilterで */
function knightTone(r){
  const t=KTONE[Math.max(0,Math.min(KTONE.length-1,r|0))];
  return 'brightness('+t[0]+') saturate('+t[1]+')';
}
const KHMAX=75;
function avatarSVG(r){
  const i=Math.max(0,Math.min(KNAME.length-1,r|0)), z=knightSize(i,'idle');
  return '<div class="spr av"><img src="'+knightSrc(i,'idle')+'" alt="" '
    +'style="height:'+(z[1]/KHMAX*100).toFixed(1)+'%;filter:'+knightTone(i)+' '+knightAura(i)+'"></div>';
}
function knightName(r){return KNAME[Math.max(0,Math.min(KNAME.length-1,r|0))];}
/** 段階ごとのオーラ（CSSのdrop-shadowを重ねる） */
function knightAura(r){
  const A=KAURA[Math.max(0,Math.min(KAURA.length-1,r|0))], c=A[0], s=A[1], b=A[2];
  const hex=a=>c.length>7?c:c+Math.round(a*255).toString(16).padStart(2,'0');
  return 'drop-shadow(0 0 '+Math.round(b*0.5)+'px '+hex(s*0.85)+') '
       + 'drop-shadow(0 0 '+b+'px '+hex(s*0.55)+') '
       + 'drop-shadow(0 0 '+Math.round(b*2)+'px '+hex(s*0.32)+')';
}
/** 足元の光の広がり（床を照らす） */
function auraFloor(r){
  const A=KAURA[Math.max(0,Math.min(KAURA.length-1,r|0))];
  return {c:A[0].slice(0,7), a:A[1]};
}

/* ---- スゴロク盤（72階の蛇行路） ---- */
function boardSVG(){
  const fl=stepSum(db), COLS=12, ROWS=6, W=336, cw=W/COLS, ch=24;
  const pos=n=>{const r=Math.floor((n-1)/COLS), i=(n-1)%COLS;
    const c=(r%2===0)?i:(COLS-1-i);
    return {x:c*cw+cw/2, y:(ROWS-1-r)*ch+ch/2+5};};
  let s='<svg viewBox="0 0 '+W+' '+(ROWS*ch+10)+'" style="width:100%;height:auto">';
  let path='',dp='';
  for(let n=1;n<=72;n++){const p=pos(n);path+=(n===1?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1);}
  for(let n=1;n<=Math.max(1,fl);n++){const p=pos(n);dp+=(n===1?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1);}
  s+='<path d="'+path+'" stroke="#232B3E" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<path d="'+dp+'" stroke="#E8C15A" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>';
  const LIT=['#C6D2E4','#F0C050','#7FD4E0'];
  for(let n=1;n<=72;n++){
    const p=pos(n), done=n<=fl, cu=n===fl, gate=(n===24||n===48||n===72);
    const dom=n<=24?0:(n<=48?1:2);
    if(gate){
      s+='<rect x="'+(p.x-5.4)+'" y="'+(p.y-5.4)+'" width="10.8" height="10.8" rx="1.2" '
       +'fill="'+(done?LIT[dom]:'#161E2C')+'" stroke="'+(done?'#FFFFFF':'#333D54')+'" stroke-width="1.2"'
       +' transform="rotate(45 '+p.x+' '+p.y+')"/>';
    }else{
      s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(cu?4.6:3)+'" '
       +'fill="'+(cu?'#FFFFFF':done?'#E8C15A':'#232B3E')+'"'
       +(cu?' stroke="#7FD4E0" stroke-width="2"':'')+'/>';
    }
    if(n%12===1||gate)s+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-8.4)+'" fill="#5A6478" font-size="7" '
      +'font-family="Oswald" text-anchor="middle">'+n+'</text>';
  }
  return s+'</svg>';
}

/* ============================================================
   4.9 次の指令（ローテーション）
   曜日で固定せず「やったら次」で回す。
   拮抗ペア4組を、最後に触った日が古い順に提示する。
   休んだ日は何も進まないので、再開時はそのまま続きから。
   ============================================================ */
const PAIRS=[['p1','p3'],['p5','p7'],['p2','p4'],['p6','p8']];
/** その系統を最後に記録した日（未記録は空文字＝最優先） */
function lastDone(id){
  let m='';db.logs.forEach(l=>{if(l.ex===id&&l.date>m)m=l.date;});
  return m;
}
/** ペアの鮮度＝2系統のうち古いほうの日付。
    片方だけ済ませたペアは「古いほう」が残るので、次も先頭に出て残りを促す */
function pairFresh(pr){
  const a=lastDone(pr[0]),b=lastDone(pr[1]);
  return a<b?a:b;
}
/** 提示順に並べ替えたペア一覧 */
function pairQueue(){
  return PAIRS.map((pr,i)=>({pr:pr,f:pairFresh(pr),i:i}))
    .sort((x,y)=>x.f===y.f?x.i-y.i:(x.f<y.f?-1:1));
}
/** 次の指令。達成した瞬間に次のペアへ進む（1日に何組でも回せる） */
function nextPair(){
  const t=today(),q=pairQueue();
  const un=q.filter(o=>!o.pr.every(id=>logsOn(t,id).length>0));
  return (un.length?un[0]:q[0]).pr;
}
/** 今日こなした指令の数 */
function pairsClearedToday(){
  const t=today();
  return PAIRS.filter(pr=>pr.every(id=>logsOn(t,id).length>0)).length;
}
/** 今日の分を消化し終えたか */
function pairDoneToday(pr){
  const t=today();
  return pr.every(id=>logsOn(t,id).length>0);
}

/* ============================================================
   6. 記録
   ============================================================ */
let cur=null;            // 記録中の種目ID
let logStep=1;           // 記録するステップ
let target=1;            // 狙う段階（基準の回数をあらかじめ入れるために使う）
let sets=[];             // 実際にできた回数（セットごと）
let rpe=0, memo='';
let fxHit=false;         // 守護者にダメージを与えた瞬間かどうか

function openLog(id){
  cur=id;logStep=step(id);rpe=0;memo='';fxHit=false;
  aimTier(Math.min(3,bestTier(id,logStep)+1)||1,true);   /* 次に狙う段階を初期表示 */
  go(1);renderLog();
}
/** 段階を選ぶ＝その基準の回数をあらかじめ入れる（あとから実数に直せる） */
function aimTier(t,silent){
  const g=stdOf(cur,logStep,t);
  target=t;sets=[];
  for(let i=0;i<g[0];i++)sets.push(g[1]);
  if(!silent)renderLog();
}
/** その系統・そのステップの直近の記録（なければnull） */
function lastLog(id,st){
  let best=null;
  db.logs.forEach(l=>{
    if(l.ex!==id||l.step!==st)return;
    if(!best||l.date>best.date)best=l;
  });
  return best;
}
/** 前回の記録を1行で */
function lastLine(id,st){
  const l=lastLog(id,st);
  if(!l)return '<div class="lastrec none">このステップは記録なし</div>';
  const sd=stepData(id,st),un=sd.unit==='s'?'秒':'回';
  const pt=l.date.split('-');
  const reps=(l.sets&&l.sets.length)?l.sets.join('-'):stdOf(id,st,tierOf(l)).join('\u00d7');
  return '<div class="lastrec"><span>前回 '+(+pt[1])+'/'+(+pt[2])+'</span>'
   +'<b>'+reps+un+'</b><i>'+TIER[tierOf(l)]+'</i></div>';
}

/** 入力した実回数から「実際に達成した段階」を判定する */
function achieved(){
  const sd=stepData(cur,logStep);
  if(meetsPro(sets,sd.pro))return 3;
  if(meetsPro(sets,sd.int))return 2;
  if(meetsPro(sets,sd.beg))return 1;
  return 0;
}

  /* --- 種目選択 --- */
  if(!cur){
    let h='<span class="eyebrow">Select exercise</span>';
    EX.forEach(e=>{const st=step(e.id),sd=stepData(e.id,st),b=bestTier(e.id,st);

       +'<div class="ex-top"><div class="ex-name">'+e.n+'</div>'
       +'<span class="ex-step">STEP '+String(st).padStart(2,'0')+'</span></div>'
       +'<div class="ex-sub">'+sd.name+'</div>'
       +'<div class="guard"><span class="guard-n">'+(b?'到達 '+TIER[b]:'未着手')+'</span>'
       +'<div class="hp">'+hpPips(guardHP(e.id))+'</div></div></div></button>';});
    $('#v-log').innerHTML=h;fxHit=false;return;
  }

  const e=ex(cur),sd=stepData(cur,logStep),unit=sd.unit==='s'?'秒':'回';
  const done=bestTier(cur,logStep),ach=achieved();
  const gd=guardHP(cur,ach,logStep),dead=gd.d>=3;
  let h='<button class="btn ghost sm" style="margin-bottom:12px" onclick="cur=null;renderLog()">← 種目を選び直す</button>';

  /* --- 守護者 --- */
  let pips='';for(let i=0;i<3;i++)pips+='<i class="'+(i<gd.d?(dead?'k':'d'):'')+'"></i>';
  h+=lastLine(cur,logStep);
  h+=stageHTML(cur,logStep,gd.d,dead)
   +'<div class="slab" style="text-align:center;margin-top:-2px">'
   +'<div class="gname">守護者 <b>'+guardName(cur,logStep)+'</b>'
   +'<span class="muted" style="font-size:11px;margin-left:8px">'+DOMN[domOf(logStep)]+'</span></div>'
   +'<div class="muted" style="margin-top:7px;font-size:12px">'
   +(dead?'上級まで討伐済み — 記録すれば進級できる':'段階をクリアするごとに1ダメージ')+'</div></div>';

  /* --- ステップ --- */
  h+='<div class="slab"><span class="eyebrow">Step</span><div class="steppick">'
   +'<button onclick="setStep(-1)" '+(logStep<=1?'disabled':'')+'>−</button>'
   +'<div><b>STEP '+String(logStep).padStart(2,'0')+'</b><span>'+sd.name+'</span></div>'
   +'<button onclick="setStep(1)" '+(logStep>=9?'disabled':'')+'>＋</button></div>'
   +(logStep!==step(cur)?'<div class="muted" style="font-size:11px;margin-top:8px;text-align:center">現在のステップは '+step(cur)+' です</div>':'')
   +'</div>';

  /* --- 狙う段階（タップで基準の回数が入る） --- */
  h+='<span class="eyebrow">狙う段階</span><div class="slab">';
  [1,2,3].forEach(t=>{
    const g=stdOf(cur,logStep,t),got=done>=t;
    h+='<button class="tier'+(target===t?' on':'')+(got?' got':'')+'" onclick="aimTier('+t+')">'
     +'<div class="tk">'+(target===t?'●':got?'✓':'')+'</div>'
     +'<div class="tn">'+TIER[t]+(t===3?'<em>進級基準</em>':'')+'</div>'
     +'<div class="tv">'+g[0]+' × '+g[1]+'<span>'+unit+'</span></div></button>';});
  h+='</div>';

  /* --- 実際にできた回数 --- */
  const g0=stdOf(cur,logStep,target);
  h+='<span class="eyebrow">実際にできた'+unit+'数</span><div class="slab">';
  sets.forEach((v,i)=>{
    h+='<div class="setrow"><div class="setno">SET '+(i+1)+'</div>'
      +'<div class="hit">'+(v>=g0[1]?'基準◎':'')+'</div>'
      +'<div class="stepper"><button onclick="bump('+i+',-1)" aria-label="減らす">−</button>'
      +'<input type="number" inputmode="numeric" value="'+v+'" onchange="setVal('+i+',this.value)">'
      +'<button onclick="bump('+i+',1)" aria-label="増やす">＋</button></div></div>';});
  h+='<div class="row2" style="margin-top:12px">'
    +'<button class="btn sm" style="width:100%" onclick="addSet()">セットを追加</button>'
    +'<button class="btn sm ghost" style="width:100%" onclick="delSet()">最後を削除</button></div>'
    +'<div class="achv'+(ach?' ok':'')+'">達成段階 <b>'+(ach?TIER[ach]:'基準未満')+'</b>'
    +'<span>合計 '+sets.reduce((a,b)=>a+b,0)+unit+'</span></div></div>';

  /* --- きつさ・メモ --- */
  h+='<div class="slab"><span class="eyebrow">きつさ</span><div class="rpe">';
  ['楽','やや楽','普通','きつい','限界'].forEach((l,i)=>{
    h+='<button class="'+(rpe===i+1?'on':'')+'" onclick="rpe='+(i+1)+';renderLog()">'+(i+1)
     +'<div style="font-size:9px;letter-spacing:0">'+l+'</div></button>';});
  h+='</div></div>';
  h+='<div class="slab"><span class="eyebrow">メモ</span>'
   +'<textarea id="memo" placeholder="フォームの気づき、体調など" oninput="memo=this.value">'+esc(memo)+'</textarea></div>';
  h+='<button class="btn primary" onclick="saveLog()">この内容で記録する</button>';
  $('#v-log').innerHTML=h;fxHit=false;
}
function setStep(d){logStep=Math.min(9,Math.max(1,logStep+d));aimTier(Math.min(3,bestTier(cur,logStep)+1)||1);}
function bump(i,d){
  const before=Math.max(achieved(),bestTier(cur,logStep));
  sets[i]=Math.max(0,(sets[i]||0)+d);
  if(achieved()>before)fxHit=true;
  renderLog();
}
function setVal(i,v){
  const before=Math.max(achieved(),bestTier(cur,logStep));
  sets[i]=Math.max(0,parseInt(v)||0);
  if(achieved()>before)fxHit=true;
  renderLog();
}
function addSet(){if(sets.length<12){sets.push(sets[sets.length-1]||0);renderLog();}}
function delSet(){if(sets.length>1){sets.pop();renderLog();}}

/** 1回ぶんの斬撃を9コマで再生。blocked=trueなら弾かれる */
function _lunge(rank,blocked,power,cb){
  const fh=document.getElementById('fh'), img=document.getElementById('fhimg'),
        fg=document.getElementById('fg'), st=document.getElementById('stage'),
        dn=document.getElementById('dmgn');
  if(!fh||!fg){if(cb)cb();return;}
  const T=(f,ms)=>setTimeout(f,ms);
  const tone=knightTone(rank)+' '+knightAura(rank);
  const setF=p=>{ img.src=knightSrc(rank,p);
    img.style.height=Math.round(knightSize(rank,p)[1]*1.30)+'px';
    img.style.filter=tone; };
  /* コマ番号と表示時刻(ms)。4〜6が斬撃の核心なので短く刻む */
  const SEQ=[['a1',0],['a2',45],['a3',100],['a4',150],['a5',195],
             ['a6',245],['a7',300],['a8',345],['a9',385]];
  SEQ.forEach(([p,ms])=>T(()=>setF(p),ms));
  T(()=>fh.classList.add('wind'),40);
  T(()=>{ fh.classList.remove('wind'); fh.classList.add('lunge'); },145);
  T(()=>{
    if(blocked){
      fg.classList.add('block');
      fh.classList.remove('lunge'); fh.classList.add('recoil');
      setF('a3');
    }else{
      fg.classList.add('hit');
      st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
      dn.textContent=power>1?'CRITICAL':'1';
      dn.style.fontSize=power>1?'20px':'30px';
      dn.classList.remove('on'); void dn.offsetWidth; dn.classList.add('on');
    }
  },200);
  T(()=>{ fg.classList.remove('hit','block'); },310);
  T(()=>{ fh.classList.remove('lunge','recoil'); },330);
  T(()=>{ setF('idle'); if(cb)cb(); },430);
}
/** 達成段階に応じた一連の演出。終わったらdoneを呼ぶ */
function playAttack(tier,id,done){
  const st=document.getElementById('stage');
  if(!st){done();return;}
  /* 記録ボタンは画面下にあるので、演出が見えるようステージまで戻す */
  try{ st.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){ window.scrollTo(0,0); }
  setTimeout(()=>_playAttack(tier,id,done),340);
}
function _playAttack(tier,id,done){
  const st=document.getElementById('stage');
  if(!st){done();return;}
  const rank=avTier(rankOf(cutPct(db)));
  const hp=document.getElementById('sthp');
  const fill=n=>{ if(!hp)return; [...hp.children].forEach((e,i)=>e.classList.toggle('d',i<n)); };
  const before=Math.max(0,Math.min(3,bestTier(id,logStep)));
  if(tier===0){                                  /* 基準未満：弾かれる */
    _lunge(rank,true,0,()=>setTimeout(done,180));
    return;
  }
  let i=0;
  const hits=tier;                               /* 初級1 中級2 上級3 */
  const step_=()=>{
    _lunge(rank,false,(i===hits-1&&tier===3)?2:1,()=>{
      i++; fill(Math.max(before,i));
      if(i<hits){ setTimeout(step_,45); }
      else if(tier===3){                          /* 討伐 */
        const fg=document.getElementById('fg');
        setTimeout(()=>{ if(fg)fg.classList.add('dead'); },80);
        setTimeout(done,580);
      }else setTimeout(done,150);
    });
  };
  step_();
}

let _busy=false;
function saveLog(){
  if(_busy)return;                       /* 演出中の二重タップを無視 */
  const use=sets.filter(v=>v>0);
  if(!use.length){toast('回数を入力してください');return;}
  _busy=true;
  const t=achieved();
  const beforeRem=remain(db);
  const m=combo(),gain=Math.round((20+Math.max(1,t)*30)*m);
  db.logs.push({date:today(),ex:cur,step:logStep,tier:t,sets:use,unit:stepData(cur,logStep).unit,
                rpe:rpe,memo:memo,xp:gain});
  db.rest=db.rest.filter(d=>d!==today());
  const newQ=checkQuests();
  const card=drawCard();
  save();
  const promo=(t===3&&logStep===step(cur)&&logStep<9);
  const id=cur, stp=logStep;
  playAttack(t,id,()=>{
    _busy=false;
    cur=null;renderAll();go(0);
    pending=promo?id:null;
    showResult(gain,m,newQ,card,beforeRem,id,stp,t,use);
  });
}

/** 数字がパチパチ上がる演出 */
function countUp(id,to){
  const el=document.getElementById(id);if(!el)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to;return;}
  const t0=performance.now(),dur=800;
  (function tick(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(to*e);
    if(p<1)requestAnimationFrame(tick);
  })(t0);
}

/* ---- 記録の削除 ---- */
function askDelete(i){
  const l=db.logs[i];
  if(!l){toast('その記録は見つかりません');return;}
  const sd=stepData(l.ex,l.step), un=sd.unit==='s'?'秒':'回';
  const pt=l.date.split('-');
  const reps=(l.sets&&l.sets.length)?l.sets.join(' / ')+' '+un:TIER[tierOf(l)]+'基準';
  /* この記録が、そのステップで唯一の最高到達だったか */
  const t=tierOf(l);
  const others=db.logs.filter((x,k)=>k!==i&&x.ex===l.ex&&x.step===l.step&&tierOf(x)>=t).length;
  const warn=(t>=3&&others===0&&step(l.ex)>l.step)
    ? '<div class="muted" style="font-size:11px;margin-top:10px;color:var(--rust)">'
      +'この記録で進級しています。削除してもステップは自動では戻りません。'
      +'必要なら「階級」画面の下部で手動で戻してください。</div>' : '';
  modal('<div style="font-size:17px;font-weight:700;margin-bottom:10px">この記録を削除しますか</div>'
   +'<div class="slab" style="text-align:left;margin-bottom:14px">'
   +'<div style="font-size:13px">'+(+pt[1])+'/'+(+pt[2])+'　'+ex(l.ex).n+'　STEP '+l.step+'</div>'
   +'<div class="muted" style="font-size:12px;margin-top:4px">'+reps+'　'+(TIER[t]||'基準未満')
   +'</div></div>'
   +warn
   +'<button class="btn primary" style="margin-top:12px;background:var(--rust);border-color:var(--rust)" '
   +'onclick="doDelete('+i+')">削除する</button>'
   +'<button class="btn ghost" style="margin-top:8px" onclick="closeModal()">やめる</button>');
}
function doDelete(i){
  if(!db.logs[i]){closeModal();return;}
  db.logs.splice(i,1);
  save();closeModal();renderAll();toast('記録を削除した');
}

function renderDetail(id){

    if(l.date>o.last)o.last=l.date;
  });

  h+='<div class="stats"><div><b>'+logs.length+'</b><span>記録数</span></div>'

   +'<div><b>'+(cur.best||0)+'</b><span>最高の合計</span></div></div>';

  /* ステップの歩み */

        : '未着手')+'</div></div>'

  const rec=logs.slice().sort(cmpLog);

    :'<div class="muted" style="text-align:center;padding:16px 0">まだ記録がない</div>';
  if(logs.length>dHistN)h+='<button class="btn sm ghost" style="width:100%;margin-top:10px" onclick="dHistN+=30;renderProg()">さらに30件表示</button>';

/** きりのいい上限値を選ぶ */
function niceTop(v){
  if(v<=0)return 10;
  const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;
  const n=f<=1?1:f<=1.5?1.5:f<=2?2:f<=3?3:f<=4?4:f<=5?5:f<=7.5?7.5:10;
  return n*p;
}
/** 到達度（ステップ×段階）の推移。単調に上がっていくのが見える */
function reachSeries(id){
  const dates=[...new Set(db.logs.map(l=>l.date))].sort();
  const out=[];
  if(id!=='all'){
    let best=0;
    dates.forEach(dt=>{const ls=db.logs.filter(l=>l.date===dt&&l.ex===id);
      if(!ls.length)return;
      ls.forEach(l=>{best=Math.max(best,reachOf(l));});
      out.push({d:dt,v:best});});
  }else{
    const best={};EX.forEach(e=>best[e.id]=0);
    dates.forEach(dt=>{db.logs.filter(l=>l.date===dt).forEach(l=>{best[l.ex]=Math.max(best[l.ex],reachOf(l));});
      out.push({d:dt,v:EX.reduce((a,e)=>a+best[e.id],0)});});
  }
  return out;
}
/** 日ごとの合計回数を棒グラフで描く */
function chartVol(id){
  const rows={};
  const src=(id==='all')?db.logs:db.logs.filter(l=>l.ex===id);
  src.forEach(l=>{rows[l.date]=(rows[l.date]||0)+repsOf(l);});
  const keys=Object.keys(rows).sort().slice(-14);
  if(!keys.length)return '<div class="muted" style="padding:34px 0;text-align:center">この種目の記録はまだない</div>';
  const vals=keys.map(k=>rows[k]);
  let target=0,unit='回';
  if(id!=='all'){const sd=stepData(id,step(id));target=sd.pro[0]*sd.pro[1];unit=sd.unit==='s'?'秒':'回';}
  const best=Math.max.apply(null,vals);
  const top=niceTop(Math.max(best,target)*1.08);
  const W=340,H=168,L=32,R=10,T=12,B=28;
  const iw=(W-L-R)/keys.length,bw=Math.min(20,iw*0.58);
  const yy=v=>H-B-(v/top)*(H-B-T);
  let grid='';
  [0,0.5,1].forEach(f=>{const v=top*f,y=yy(v);
    grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#4E4C43" stroke-width="'+(f===0?1:0.6)+'" opacity="'+(f===0?1:0.45)+'"/>'
       +'<text x="'+(L-5)+'" y="'+(y+3.4).toFixed(1)+'" fill="#948F82" font-size="9" font-family="Oswald" text-anchor="end">'+Math.round(v)+'</text>';});
  let tg='';
  if(target&&target<=top){const y=yy(target);
    tg='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#B4553A" stroke-width="1.2" stroke-dasharray="4 3"/>'
      +'<text x="'+(W-R)+'" y="'+(y-4).toFixed(1)+'" fill="#C2603C" font-size="9" font-family="Oswald" text-anchor="end">進級基準 '+target+'</text>';}
  let bars='',every=Math.ceil(keys.length/7);
  vals.forEach((v,i)=>{const cx=L+iw*i+iw/2,y=yy(v),hg=Math.max(2,H-B-y);
    bars+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hg.toFixed(1)+'" rx="1.5" fill="'+(v===best?'#EDE8DA':'#C9A227')+'"/>';
    if(i%every===0||i===keys.length-1){const pt=keys[i].split('-');
      bars+='<text x="'+cx.toFixed(1)+'" y="'+(H-B+13)+'" fill="#948F82" font-size="9" font-family="Oswald" text-anchor="middle">'+(+pt[1])+'/'+(+pt[2])+'</text>';}});
  const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid+tg+bars+'</svg>'
   +'<div class="cstat"><div><b>'+vals[vals.length-1]+'</b><span>直近</span></div>'
   +'<div><b>'+avg+'</b><span>平均</span></div>'
   +'<div><b>'+best+'</b><span>最高</span></div>'
   +(target?'<div><b>'+target+'</b><span>進級基準</span></div>':'')+'</div>'
   +'<div class="muted" style="text-align:center;font-size:11px;margin-top:8px">直近'+keys.length+'回・1日あたりの合計'+unit+'数</div>';
}
function chart(id){
  const ser=reachSeries(id).slice(-14);
  if(!ser.length)return '<div class="muted" style="padding:34px 0;text-align:center">この種目の記録はまだない</div>';
  const vals=ser.map(o=>o.v),curv=vals[vals.length-1];
  const cap=id==='all'?216:27;                       /* 満点＝全ステップ上級 */
  const unitStep=id==='all'?24:3;                    /* 目盛り1つ＝1ステップ分 */
  const top=Math.min(cap,Math.max(unitStep*2,Math.ceil((curv+unitStep*0.6)/unitStep)*unitStep));
  const W=340,H=168,L=32,R=10,T=12,B=28;
  const iw=(W-L-R)/ser.length, bw=Math.min(20,iw*0.58);
  const yy=v=>H-B-(v/top)*(H-B-T);

  let grid='';
  const lines=Math.min(6,Math.round(top/unitStep));
  for(let k=0;k<=lines;k++){
    const v=top*k/lines,y=yy(v);
    const lab=id==='all'?Math.round(v/24*10)/10+'':'S'+Math.min(9,Math.floor(v/3)+(v%3===0&&v>0?0:1));
    grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)
      +'" stroke="#4E4C43" stroke-width="'+(k===0?1:0.6)+'" opacity="'+(k===0?1:0.4)+'"/>'
      +'<text x="'+(L-5)+'" y="'+(y+3.4).toFixed(1)+'" fill="#948F82" font-size="9" font-family="Oswald" text-anchor="end">'
      +(k===0?'0':lab)+'</text>';
  }
  /* --- 折れ線で描く（成長の推移） --- */
  let bars='',every=Math.ceil(ser.length/7);
  const P=ser.map((o,i)=>({x:L+iw*i+iw/2,y:yy(o.v),v:o.v,d:o.d,i:i}));
  const pstr=P.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  if(P.length>1){
    bars+='<polygon points="'+P[0].x.toFixed(1)+','+(H-B)+' '+pstr+' '+P[P.length-1].x.toFixed(1)+','+(H-B)
      +'" fill="#C9A227" opacity=".12"/>';
    bars+='<polyline points="'+pstr+'" fill="none" stroke="#C9A227" stroke-width="2" '
      +'stroke-linejoin="round" stroke-linecap="round"/>';
  }
  P.forEach(p=>{
    const isNew=p.i>0&&p.v>ser[p.i-1].v;
    bars+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(isNew?3.6:2.4)
      +'" fill="'+(isNew?'#EDE8DA':'#C9A227')+'"'+(isNew?' stroke="#C9A227" stroke-width="1.2"':'')+'/>';
    if(p.i%every===0||p.i===P.length-1){const pt=p.d.split('-');
      bars+='<text x="'+p.x.toFixed(1)+'" y="'+(H-B+13)+'" fill="#948F82" font-size="9" font-family="Oswald" text-anchor="middle">'
        +(+pt[1])+'/'+(+pt[2])+'</text>';}
  });
  /* 段階別の回数 */
  const src=(id==='all')?db.logs:db.logs.filter(l=>l.ex===id);
  const cnt=[0,0,0];src.forEach(l=>cnt[tierOf(l)-1]++);
  const mx=Math.max(1,cnt[0],cnt[1],cnt[2]);
  let tb='<div class="tcount">';
  [1,2,3].forEach(t=>{tb+='<div><span>'+TIER[t]+'</span>'
    +'<i style="width:'+(cnt[t-1]/mx*100).toFixed(0)+'%"></i><b>'+cnt[t-1]+'</b></div>';});
  tb+='</div>';

  const nowLab=id==='all'
    ? '合計 '+curv+' / 216'
    : (curv<=0 ? '基準未満'
       : 'STEP '+Math.min(9,Math.floor((curv-1)/3)+1)+' ・ '+TIER[((curv-1)%3)+1]);
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid+bars+'</svg>'
   +'<div class="muted" style="text-align:center;font-size:11px;margin-top:6px">'
   +'到達度の推移（白い棒＝更新した日）／ 現在 '+nowLab+'</div>'
   +'<div class="eyebrow" style="margin-top:16px">Records by tier</div>'+tb;
}
function calendar(){
